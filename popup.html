<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    /* hidden must always win, even over our display:flex rows */
    [hidden] { display: none !important; }

    body {
      width: 340px;
      margin: 0;
      padding: 12px;
      font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #f3f4f6;
      -webkit-font-smoothing: antialiased;
      position: relative;
      /* deep base + soft light blooms the frosted layers refract against */
      background:
        radial-gradient(115% 75% at 12% -5%, rgba(229,57,53,.22), transparent 60%),
        radial-gradient(120% 85% at 105% 8%, rgba(255,138,101,.12), transparent 55%),
        radial-gradient(150% 130% at 50% 118%, rgba(86,108,168,.16), transparent 62%),
        linear-gradient(165deg, #16181e 0%, #0c0e12 100%);
    }

    /* ---- shared frosted-glass surface ------------------------------------ */
    header, .count, .list, .allowed, .sitebar, footer {
      position: relative;
      background: rgba(255,255,255,.07);
      -webkit-backdrop-filter: blur(30px) saturate(180%);
      backdrop-filter: blur(30px) saturate(180%);
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 18px;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.22),
        inset 0 -1px 0 rgba(0,0,0,.20),
        0 10px 26px rgba(0,0,0,.34);
    }
    /* specular sheen across the top of each pane */
    header::before, .count::before, .list::before, .allowed::before,
    .sitebar::before, footer::before {
      content: "";
      position: absolute; inset: 0;
      border-radius: inherit;
      background: linear-gradient(180deg, rgba(255,255,255,.12), rgba(255,255,255,0) 45%);
      pointer-events: none;
    }

    header {
      display: flex; align-items: center; gap: 9px;
      padding: 13px 15px; margin-bottom: 10px;
    }
    header .dot {
      width: 10px; height: 10px; border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #ff8a80, #e53935 70%);
      box-shadow: 0 0 10px rgba(229,57,53,.9), inset 0 0 2px rgba(255,255,255,.6);
      flex: 0 0 auto;
    }
    header h1 { font-size: 13.5px; font-weight: 650; margin: 0; letter-spacing: .2px; }
    header .brand { display: flex; flex-direction: column; gap: 1px; }
    header .tag { font-size: 10px; color: #969ca6; font-weight: 400; letter-spacing: .15px; }

    .count { padding: 20px 14px 15px; margin-bottom: 10px; text-align: center; }
    .count .n {
      font-size: 48px; font-weight: 800; line-height: 1;
      background: linear-gradient(180deg, #ff9d93, #e53935);
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent; color: #ff6b6b;
      filter: drop-shadow(0 2px 14px rgba(229,57,53,.45));
    }
    .count .label { font-size: 12px; color: #c6cbd3; margin-top: 7px; }
    .count .alltime { font-size: 11px; color: #969ca6; margin-top: 7px; }
    .count .alltime b { color: #ccd1d9; font-weight: 600; }

    .list {
      margin-bottom: 10px; max-height: 260px; overflow-y: auto;
      padding: 2px 0;
    }
    .list::-webkit-scrollbar { width: 9px; }
    .list::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,.18); border-radius: 9px;
      border: 2px solid transparent; background-clip: padding-box;
    }
    .list::-webkit-scrollbar-track { background: transparent; }

    .row {
      padding: 11px 15px;
      display: flex; flex-direction: column; gap: 3px;
    }
    .row + .row { border-top: 1px solid rgba(255,255,255,.08); }
    .row .kind {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
    }
    .row .kindleft {
      font-size: 10px; text-transform: uppercase; letter-spacing: .05em;
      color: #ffb59e;
    }
    .row .kindleft .time { color: #969ca6; }
    .row .hostline {
      display: flex; align-items: baseline; justify-content: space-between; gap: 8px;
    }
    .row .host {
      font-size: 14px; font-weight: 600; color: #f3f4f6;
      word-break: break-all;
    }
    .row .times {
      flex: 0 0 auto; font-size: 11px; font-weight: 700; color: #ffb59e;
      background: rgba(229,57,53,.20); border: 1px solid rgba(255,138,101,.28);
      border-radius: 10px; padding: 1px 8px;
    }
    .row .url {
      font-size: 11px; color: #969ca6;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    .act {
      flex: 0 0 auto;
      font-size: 11px; padding: 4px 11px; border-radius: 9px;
      border: 1px solid rgba(140,195,255,.32);
      background: rgba(120,170,255,.16); color: #c2dcff; cursor: pointer;
      transition: background .15s, transform .05s;
    }
    .act:hover { background: rgba(120,170,255,.26); }
    .act:active { transform: scale(.97); }
    .empty { padding: 24px 18px; text-align: center; color: #aeb4bd; line-height: 1.5; }

    .allowed {
      padding: 11px 13px; margin-bottom: 10px;
      display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
    }
    .allowed .lbl { font-size: 11px; color: #969ca6; margin-right: 2px; }
    .chip {
      font-size: 11px; background: rgba(255,255,255,.09);
      border: 1px solid rgba(255,255,255,.16);
      border-radius: 11px; padding: 2px 4px 2px 9px; color: #e2e6eb;
      display: inline-flex; align-items: center; gap: 3px;
    }
    .chip button {
      background: none; border: none; color: #969ca6; cursor: pointer;
      font-size: 13px; line-height: 1; padding: 0 4px;
    }
    .chip button:hover { color: #ff8a80; }

    /* ---- Strict-on-this-site bar ----------------------------------------- */
    .sitebar {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      padding: 13px 15px; margin-bottom: 10px;
    }
    .sitebar .txt { font-size: 12px; color: #f3f4f6; min-width: 0; }
    .sitebar .title-row { display: flex; align-items: center; gap: 7px; }
    .sitebar .ttl { font-weight: 600; }
    .sitebar .sub {
      display: block; font-size: 10px; color: #969ca6; margin-top: 3px; font-weight: 400;
      max-width: 210px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .sitebar .sub.nudge { color: #ffb59e; }

    /* mode pill: Smart by default, Strict when the toggle is on (no JS) */
    .mode {
      font-size: 9px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
      padding: 2px 7px; border-radius: 999px; line-height: 1.5;
      background: rgba(120,170,255,.16); border: 1px solid rgba(140,195,255,.32); color: #c2dcff;
    }
    .mode::after { content: "Smart"; }
    .sitebar:has(#strictToggle:checked) .mode {
      background: rgba(229,57,53,.22); border-color: rgba(255,138,101,.42); color: #ffb59e;
    }
    .sitebar:has(#strictToggle:checked) .mode::after { content: "Strict"; }

    /* info icon + glass tooltip explaining Smart vs Strict */
    .info {
      display: inline-flex; align-items: center; justify-content: center;
      width: 15px; height: 15px; padding: 0; border-radius: 50%;
      border: 1px solid rgba(255,255,255,.30); background: rgba(255,255,255,.10);
      color: #c6cbd3; font-size: 9px; font-weight: 700; line-height: 1;
      cursor: help; position: static;
    }
    .info:hover, .info:focus-visible { background: rgba(255,255,255,.22); color: #fff; outline: none; }
    .tip {
      position: absolute; left: 13px; right: 13px; bottom: calc(100% + 10px);
      padding: 10px 12px; border-radius: 13px; text-align: left;
      background: rgba(26,28,36,.78);
      -webkit-backdrop-filter: blur(30px) saturate(180%); backdrop-filter: blur(30px) saturate(180%);
      border: 1px solid rgba(255,255,255,.18);
      box-shadow: 0 14px 34px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.20);
      color: #dfe3e8; font-size: 11px; line-height: 1.55; font-weight: 400;
      opacity: 0; visibility: hidden; transform: translateY(4px);
      transition: opacity .15s, transform .15s; z-index: 20; pointer-events: none;
    }
    .tip b { color: #ffb59e; font-weight: 700; }
    .info:hover .tip, .info:focus .tip, .info:focus-visible .tip {
      opacity: 1; visibility: visible; transform: translateY(0);
    }

    .switch { position: relative; display: inline-block; width: 42px; height: 24px; flex: 0 0 auto; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; inset: 0; border-radius: 24px; cursor: pointer;
      background: rgba(255,255,255,.12);
      border: 1px solid rgba(255,255,255,.18);
      box-shadow: inset 0 1px 2px rgba(0,0,0,.3);
      transition: .18s;
    }
    .slider:before {
      content: ""; position: absolute; height: 18px; width: 18px; left: 3px; top: 2.5px;
      border-radius: 50%;
      background: linear-gradient(180deg, #ffffff, #d7dbe0);
      box-shadow: 0 2px 4px rgba(0,0,0,.35);
      transition: .18s;
    }
    .switch input:checked + .slider {
      background: linear-gradient(180deg, rgba(255,138,101,.92), rgba(229,57,53,.96));
      border-color: rgba(255,138,101,.5);
      box-shadow: inset 0 1px 2px rgba(0,0,0,.2), 0 0 12px rgba(229,57,53,.5);
    }
    .switch input:checked + .slider:before { transform: translateX(18px); }
    .switch input:disabled + .slider { opacity: .65; cursor: default; }

    footer {
      display: flex; justify-content: space-between; align-items: center;
      padding: 11px 13px;
    }
    footer .site { font-size: 11px; color: #969ca6; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 150px; }
    footer .actions { display: flex; align-items: center; gap: 8px; }
    button.bar {
      background: rgba(255,255,255,.09); color: #f3f4f6;
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 9px; padding: 6px 13px; font-size: 12px; cursor: pointer;
      transition: background .15s, transform .05s;
    }
    button.bar:hover { background: rgba(255,255,255,.18); }
    button.bar:active { transform: scale(.97); }
    button.link {
      background: none; border: none; color: #93c5ff; font-size: 12px;
      cursor: pointer; padding: 6px 4px;
    }
    button.link:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <header>
    <span class="dot"></span>
    <div class="brand">
      <h1>No Popunder</h1>
      <span class="tag">Junk tabs, blocked</span>
    </div>
  </header>

  <div class="count">
    <div class="n" id="count">0</div>
    <div class="label" id="label">popups blocked on this page</div>
    <div class="alltime" id="alltime"></div>
  </div>

  <div class="list" id="list"></div>

  <div class="allowed" id="allowed" hidden></div>

  <div class="sitebar" id="sitebar" hidden>
    <span class="txt">
      <span class="title-row">
        <span class="ttl">Strict on this site</span>
        <span class="mode"></span>
        <button class="info" type="button" aria-label="What does Strict mode do?">i
          <span class="tip" role="tooltip">
            <b>Smart</b> (the default) blocks pop-ups that did not follow a real click,
            so logins and video keep working.
            <b>Strict</b> blocks every cross-site pop-up here. Turn it on for streaming
            sites that still leak.
          </span>
        </button>
      </span>
      <span class="sub" id="strictSub"></span>
    </span>
    <label class="switch">
      <input type="checkbox" id="strictToggle" />
      <span class="slider"></span>
    </label>
  </div>

  <footer>
    <span class="site" id="site"></span>
    <span class="actions">
      <button class="link" id="stats">Stats</button>
      <button class="bar" id="clear">Clear</button>
    </span>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
